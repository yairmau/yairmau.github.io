project:
  type: website
  output-dir: docs
  render:
    - "**/*.qmd"
    - "**/*.ipynb"
    - "**/*.md"
    - "!AGENTS.md"
    - "!CLAUDE.md"
  resources:
    - archive/logo/favicon.ico
    - archive/logo/apple-touch-icon.png

website:
  title: "Yair Mau"
  search: false
  favicon: archive/logo/favicon.svg
  google-analytics: "G-43N4LS3BPR"
  site-url: https://yairmau.com
  open-graph:
    image: archive/images/group/yairmau_headshot.png
  twitter-card:
    image: archive/images/group/yairmau_headshot.png
  navbar:
    logo: archive/logo/phi-mark-white.svg
    logo-alt: "Yair Mau"
    pinned: false
    collapse: true
    search: false
    right:
      - science.qmd
      - papers.qmd
      - group.qmd
      - courses/index.qmd
      - more/index.qmd
format:
  html:
    theme:
      light: [flatly, custom.scss, custom-light.scss]
    highlight: false
    # https://quarto.org/docs/output-formats/html-code.html#highlighting
    highlight-style: gruvbox
    mainfont: Ubuntu
    monofont: Ubuntu Mono
    max-width: "700"
    include-in-header:
      - includes.html
    code-line-numbers: true
    # the default MathJax rendering option yields ugly results, use katex
    html-math-method: katex
    fig-align: center
    
    # embed-resources: true
# theme list: https://bootswatch.com/3/


